$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    rounding = 12
    inner_color = rgba(26, 27, 38, 0.85)
    outer_color = rgba(33, 204, 255, 1.0)
    check_color = rgba(158, 206, 106, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    font_color = rgb(192, 202, 245)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password...
    fail_text = Wrong password
    dots_spacing = 0.3
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(192, 202, 245)
    font_size = 88
    font_family = $font
    position = 0, 120
    halign = center
    valign = top
}
