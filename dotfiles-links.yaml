# Sources are repository-relative. Targets may use $CONFIG_DIR,
# $VSCODE_CONFIG_DIR, $HOME, or a leading ~.
unix_only:
  - source: .gitconfig.local
    target: ~/.gitconfig.local
    type: file
  - source: _config/git
    target: $CONFIG_DIR/git
    type: directory
  - source: _config/nvim
    target: $CONFIG_DIR/nvim
    type: directory
  - source: _config/tmux
    target: $CONFIG_DIR/tmux
    type: directory
  - source: _config/emacs
    target: $CONFIG_DIR/emacs
    type: directory
  - source: _config/helix
    target: $CONFIG_DIR/helix
    type: directory
  - source: _config/yazi
    target: $CONFIG_DIR/yazi
    type: directory
  - source: _config/nix
    target: $CONFIG_DIR/nix
    type: directory
  - source: .claude/agents
    target: ~/.claude/agents
    type: directory
  - source: _config/agents/skills/codex-user-skill-author
    target: ~/.agents/skills/codex-user-skill-author
    type: directory
  - source: _config/agents/skills/nix-env-maintainer
    target: ~/.agents/skills/nix-env-maintainer
    type: directory
  - source: _config/agents/skills/dotfiles-link-manager
    target: ~/.agents/skills/dotfiles-link-manager
    type: directory
  - source: _config/agents/skills/git-message-style
    target: ~/.agents/skills/git-message-style
    type: directory
  - source: _config/agents/skills/natural-writing-editor
    target: ~/.agents/skills/natural-writing-editor
    type: directory
  - source: _config/agents/skills/focus-mentor
    target: ~/.agents/skills/focus-mentor
    type: directory
  - source: _config/agents/skills/verify-ui-with-screenshots
    target: ~/.agents/skills/verify-ui-with-screenshots
    type: directory
  - source: _config/agents/skills/diff-command-worker
    target: ~/.agents/skills/diff-command-worker
    type: directory
  - source: _config/agents/skills/herdr-interactive-runner
    target: ~/.agents/skills/herdr-interactive-runner
    type: directory
  - source: _config/agents/skills/skills-cli-installer
    target: ~/.agents/skills/skills-cli-installer
    type: directory
  - source: _config/agents/skills/typescript-quality-reviewer
    target: ~/.agents/skills/typescript-quality-reviewer
    type: directory
  - source: _config/agents/skills/html-report-builder
    target: ~/.agents/skills/html-report-builder
    type: directory
  - source: _config/agents/skills/codex-opencode-parallel-dev
    target: ~/.agents/skills/codex-opencode-parallel-dev
    type: directory
  - source: _config/opencode/agents
    target: $CONFIG_DIR/opencode/agents
    type: directory
  - source: _config/kitty
    target: $CONFIG_DIR/kitty
    type: directory
  - source: _config/discord/settings.json
    target: $CONFIG_DIR/discord/settings.json
    type: file

macos_only:
  - source: _config/wezterm
    target: $CONFIG_DIR/wezterm
    type: directory

wsl_only: []

windows_only:
  - source: _config/wezterm
    target: $CONFIG_DIR/wezterm
    type: directory
  - source: windows/glazewm/config.yaml
    target: $HOME/.glzr/glazewm/config.yaml
    type: file
  - source: windows/powershell/Microsoft.PowerShell_profile.ps1
    target: $HOME/Documents/PowerShell/Microsoft.PowerShell_profile.ps1
    type: file

vscode:
  - source: _config/vscode/settings.json
    target: $VSCODE_CONFIG_DIR/settings.json
    type: file
  - source: _config/vscode/keybindings.json
    target: $VSCODE_CONFIG_DIR/keybindings.json
    type: file
